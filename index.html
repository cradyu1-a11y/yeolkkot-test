<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>열꽃 8인 닮은꼴 테스트</title>
<meta name="description" content="24문항, 3분. 내 성격 여섯 축의 모양이 열꽃 8인 중 누구와 가장 많이 겹치는지 알려 드려요.">
<meta property="og:type" content="website">
<meta property="og:title" content="열꽃 8인 중에 나랑 제일 닮은 사람은?">
<meta property="og:description" content="24문항, 3분. 유형으로 자르지 않고, 성격 여섯 축이 누구와 몇 % 겹치는지 보여 드려요.">
<meta property="og:image" content="og/main.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* 레이아웃: 휴대폰 한 손 기준 단일 칼럼 — 시작 → 문항 하나씩 → 결과. 결과 화면은 닮은 캐릭터의 고유 색이 주인공 */
:root{
  --bg:#FBF8F3; --surface:#FFFFFF; --ink:#1E1B18; --muted:#6B645C; --line:#E9E2D7;
  --coral:#E8553F; --yellow:#FFC531; --track:#EFE8DD; --acc:#E8553F;
  --heavy:"Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  --display:"Hahmlet","Noto Serif KR",serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161412; --surface:#211E1B; --ink:#F4EFE7; --muted:#ABA398; --line:#37322C;
  --coral:#F26F5E; --track:#2E2A25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#161412; --surface:#211E1B; --ink:#F4EFE7; --muted:#ABA398; --line:#37322C;
  --coral:#F26F5E; --track:#2E2A25; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding-inline:18px;padding-block:calc(22px + env(safe-area-inset-top,0px)) calc(56px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}
h1,h2{font-weight:900;font-family:var(--heavy);text-wrap:balance;margin:0;line-height:1.25;letter-spacing:-.02em}
h1{font-size:clamp(30px,8vw,42px)}
h2{font-size:22px}
.hl{background:linear-gradient(transparent 58%,color-mix(in srgb,var(--yellow) 75%,transparent) 58%);padding-inline:2px}
.eyebrow{font-size:13px;letter-spacing:.06em;color:var(--coral);font-weight:700}
.lead{color:var(--muted);margin:0}
.small{font-size:14px}
.grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid8 figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.tile{width:100%;aspect-ratio:1;border-radius:18px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.tile img{width:88%;aspect-ratio:1;object-fit:contain}
.grid8 figcaption{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.3;text-wrap:balance}
.btn{appearance:none;border:0;border-radius:14px;background:var(--coral);color:#fff;font:700 17px var(--body);padding:16px 20px;cursor:pointer;width:100%;text-align:center;text-decoration:none;display:block}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.dark{background:var(--ink);color:var(--bg)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.proof{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.proof b{color:var(--ink);font-variant-numeric:tabular-nums}
.friend{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;background:color-mix(in srgb,var(--fc) 14%,var(--surface));border-radius:18px;padding:12px 14px}
.friend img{width:64px;height:64px;object-fit:contain}
.friend p{margin:0;font-size:15px}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;margin:0}
.bar{height:6px;background:var(--track);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--coral);transition:width .25s}
.qnum{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between}
.qtext{font-family:var(--display);font-size:clamp(21px,5.6vw,27px);font-weight:500;line-height:1.45;min-height:3.2em;margin:0;text-wrap:balance}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{appearance:none;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:14px 16px;font:500 16px var(--body);cursor:pointer;display:flex;gap:12px;align-items:center}
.opt b{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none;font-variant-numeric:tabular-nums}
.opt:hover{border-color:var(--coral)}
.opt.on{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 10%,var(--surface))}
.opt.on b{background:var(--coral);border-color:var(--coral);color:#fff}
.back{background:none;border:0;color:var(--muted);font:500 14px var(--body);cursor:pointer;padding:6px 0;align-self:flex-start}
.hero{background:color-mix(in srgb,var(--acc) 14%,var(--surface));border-radius:24px;padding:24px 22px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.hero img{width:min(220px,62%);aspect-ratio:1;object-fit:contain}
.pct{font-family:var(--heavy);font-weight:900;font-size:56px;color:var(--acc);line-height:1;font-variant-numeric:tabular-nums}
.who{font-size:13px;color:var(--muted);letter-spacing:.04em}
.quote{font-family:var(--display);font-size:18px;margin:4px 0 0}
.block{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.block h3{margin:0;font-size:15px;color:var(--acc)}
.block p{margin:0}
.compat{gap:12px}
.compat-head{display:grid;grid-template-columns:78px 1fr;gap:14px;align-items:center}
.compat-head img{width:78px;height:78px;object-fit:contain;background:color-mix(in srgb,var(--acc) 10%,var(--bg));border-radius:16px}
.compat-head strong{display:block;font-size:17px;margin-bottom:4px}
.compat-head p{font-size:14px;color:var(--muted)}
.compat-send{font-family:var(--display);font-size:14px;background:color-mix(in srgb,var(--acc) 8%,var(--bg));border-radius:12px;padding:12px}
.compat .btn{font-size:15px;padding:13px 16px}
.cite{font-size:12.5px;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:12px}
.axis{display:grid;gap:4px}
.axcard{gap:12px}
.axis .lab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);gap:8px}
.axis .lab strong{color:var(--ink);font-size:14px}
.scale{position:relative;height:10px;background:var(--track);border-radius:99px}
.scale::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.4}
.scale i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--acc);border:3px solid var(--bg);transform:translate(-50%,-50%)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pair div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center}
.pair img{width:48px;height:48px;object-fit:contain}
.pair span{font-size:12px;color:var(--muted);display:block}
.pair strong{font-size:14px;line-height:1.35;display:block}
.rank{display:flex;flex-direction:column;gap:6px}
.rank > div{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:10px}
.rank img{width:40px;height:40px;object-fit:contain}
.rank span{font-size:14px;min-width:0}
.rank .m{height:6px;border-radius:99px;background:var(--track);grid-column:2/4;margin-top:-4px;overflow:hidden}
.rank .m i{display:block;height:100%}
.rank em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.card{width:100%;border-radius:18px;border:1px solid var(--line)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 150px}
.member{background:var(--surface);border:1.5px dashed color-mix(in srgb,var(--acc) 60%,var(--line));border-radius:16px;padding:16px;font-size:14px;display:flex;flex-direction:column;gap:10px}
.member strong{font-size:15px}
.src{font-size:12px;color:var(--muted);margin:0;line-height:1.55}
.toast{font-size:13px;color:var(--coral);min-height:1.2em;margin:0}
@media (prefers-reduced-motion: reduce){.bar > i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
